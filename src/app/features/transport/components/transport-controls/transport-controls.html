<div class="transport-controls">
  <app-record-controls></app-record-controls>

  <button
    class="transport-btn play-btn"
    [class.active]="playbackState() === PlaybackState.Playing"
    [disabled]="!hasClipsToPlay() || playbackState() === PlaybackState.Playing"
    (click)="onPlay()">
    <svg viewBox="0 0 24 24" width="16" height="16">
      <path fill="currentColor" d="M8 5v14l11-7z"/>
    </svg>
  </button>

  <button
    class="transport-btn stop-btn"
    [disabled]="playbackState() !== PlaybackState.Playing"
    (click)="onStop()">
    <svg viewBox="0 0 24 24" width="16" height="16">
      <rect fill="currentColor" x="6" y="6" width="12" height="12"/>
    </svg>
  </button>
</div>
