<div class="transport-controls">
  <app-record-controls></app-record-controls>

  <button
    class="transport-btn play-btn"
    [class.active]="playbackState() === PlaybackState.Playing"
    [disabled]="!hasClipsToPlay() || playbackState() === PlaybackState.Playing"
    (click)="onPlay()">
    <svg viewBox="0 0 24 24" width="16" height="16">
      <path fill="currentColor" d="M8 5v14l11-7z"/>
    </svg>
  </button>

  <button
    class="transport-btn stop-btn"
    [disabled]="playbackState() !== PlaybackState.Playing"
    (click)="onStop()">
    <svg viewBox="0 0 24 24" width="16" height="16">
      <rect fill="currentColor" x="6" y="6" width="12" height="12"/>
    </svg>
  </button>

  <div class="master-volume-control">
    <svg viewBox="0 0 24 24" width="14" height="14" class="volume-icon">
      <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
    </svg>
    <input
      type="range"
      min="0"
      max="100"
      [value]="masterVolume() * 100"
      (input)="onMasterVolumeChange($event)"
      title="Master Volume"
      class="master-volume-slider" />
    <span class="master-volume-value">{{ (masterVolume() * 100).toFixed(0) }}</span>
  </div>
</div>
